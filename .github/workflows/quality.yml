name: BeOnGym quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beongym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beongym_test?schema=public
      DISPOSABLE_DATABASE: 'true'
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      APP_URL: http://localhost:3400
      CHECK_BASE_URL: http://localhost:3400
      NODE_ENV: development
      DODO_PAYMENTS_API_KEY: fixture-no-network-api
      DODO_PAYMENTS_WEBHOOK_KEY: whsec_YmVvbmd5bS13ZWJob29rLXRlc3Qtc2VjcmV0
      DODO_PAYMENTS_ENVIRONMENT: test_mode
      DODO_PRODUCT_ID_MONTHLY: pdt_test_monthly
      DODO_PRODUCT_ID_ANNUAL: pdt_test_annual

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx prisma generate && npm run typecheck

      - name: Configuration regression tests
        run: npm test

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed integration fixtures
        run: npm run db:seed

      - name: Run tenant-isolation unit checks
        run: npm run check:tenant

      - name: Start application
        run: npm run dev > /tmp/beongym-next.log 2>&1 &

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:3400/api/session > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/beongym-next.log
          exit 1

      - name: Run tenant isolation integration test
        run: npm run check:isolation

      - name: Run shared rate-limit and session security regressions
        run: node --conditions=react-server --import tsx scripts/security-check.ts

      - name: Run signed billing and route regressions
        run: npm run check:webhook && npm run check:routes && npm run check:globe

      - name: Verify checkout fails closed without a gateway
        run: node --conditions=react-server --import tsx scripts/checkout-safety-check.ts
